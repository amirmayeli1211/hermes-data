# Build settings for NetCheck.
#
# These values are tuned for the GitHub Actions runner that actually builds this
# project (see .github/workflows/android.yml). The Hermes host that stores the
# source cannot run this build at all: it has 2 GB of RAM, and an AGP + Kotlin +
# KSP build needs roughly 2 GB by itself. Measured there: the first attempt was
# OOM-killed by the kernel, the second died in Metaspace. Host-specific
# overrides therefore live in ${GRADLE_USER_HOME}/gradle.properties (untracked),
# which Gradle reads *after* this file.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
