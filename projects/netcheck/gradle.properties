# The build host has 2 GB of RAM total, and the kernel OOM-killed a Gradle
# daemon (-Xmx1024m) plus a Kotlin daemon here on the first attempt. Everything
# below exists to keep the build inside one small JVM:
#   * one JVM: no Gradle daemon, and Kotlin compiles in-process instead of
#     spawning a second daemon (that second daemon alone held ~750 MB).
#   * one worker: aapt2 and the Kotlin compiler run one at a time.
#   * a 640 MB heap, which is enough for one module of this size.
# A CI runner does not need any of this and ignores these limits.
org.gradle.jvmargs=-Xmx640m -XX:MaxMetaspaceSize=256m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.daemon=false
org.gradle.workers.max=1
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
kotlin.daemon.jvmargs=-Xmx512m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
