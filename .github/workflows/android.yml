name: Android build (NetCheck)

# Cloud build for projects/netcheck. This exists because the Hermes host that
# owns this repository has 2 GB of RAM and a single 7.8 GB disk: a local Gradle
# build was OOM-killed once and filled the disk once. A runner has neither
# problem, so the APK is assembled here and downloaded as an artifact.
#
# Triggers only when the app (or this workflow) actually changes: the state sync
# rewrites the whole tree every 30 minutes, and a build per sync would burn the
# Actions minutes for nothing.

on:
  workflow_dispatch:
  push:
    # Only the default branch. The safety branch (sandbox-b1e0eab0) is moved to
    # main's tip after every sync, and a ref update there also counts as a push —
    # listing it here built every change twice. Dispatching it by hand still
    # works: ci_android_build.py --branch sandbox-b1e0eab0.
    branches: [main]
    paths:
      - "projects/netcheck/**"
      - ".github/workflows/android.yml"

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Test and assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: projects/netcheck

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle with caching
        uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        # This repository stores file contents, not git modes: the checked-out
        # gradlew arrives as 100644, so it has to be marked executable here.
        run: chmod +x gradlew

      - name: Remove a container-specific SDK path if one is present
        # local.properties would pin sdk.dir to the Hermes host and override the
        # runner's ANDROID_HOME. It is excluded from the state sync; this is the
        # belt-and-braces step.
        run: rm -f local.properties

      - name: Unit tests
        run: ./gradlew test --console=plain

      - name: Assemble debug APK
        run: ./gradlew assembleDebug --console=plain

      - name: Show APK identity
        run: |
          ls -l app/build/outputs/apk/debug/
          sha256sum app/build/outputs/apk/debug/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: netcheck-debug-apk
          path: projects/netcheck/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netcheck-test-report
          path: |
            projects/netcheck/app/build/reports/tests/**
            projects/netcheck/app/build/test-results/**
          if-no-files-found: ignore
